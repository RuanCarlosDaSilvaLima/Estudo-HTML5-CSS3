<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midia em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu anvegador</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="uma imagem flexivel que funciona">
    </picture>

    <h1>Reproduzindo Áudios </h1>
    <p>Vamos aprender a reprocuzir áudios em HTML5</p>                                                                                                                                    
    <!-- MP3 WAV OGG-->
    <audio preload="metadata" controls loop>
        <source src="midea/Bab Tista - Text Me Records _ GrandBankss.mp3" type="audio/mpeg">
        <p>Infelizmente seu navegador não carregou o audio. <a href="midea/Bab Tista - Text Me Records _ GrandBankss.mp3" download="Bab Tista - Text Me Records _ GrandBankss.mp3" type="audio/mpeg">Aqui esta o audio para download.</a></p>
    </audio>
</body>
</html>
