<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML5</h1>
    <ul type="circle">
        <li><abbr title="Use a tag <p>">Paragrafo</abbr></li>
        <li><abbr title="Use as tags <h1> ... <h6> hierarquicamente">Titulo</abbr></li>
        <li><abbr title="Use a tag <img>">Imagem</abbr></li>
        <li><abbr title="Use a tag <a>">Link</abbr></li>
        <li><abbr title="use a tag <ol>">Listas numeradas</abbr></li>
        <li><abbr title="Use a tag <ul>">Listas não numeradas</abbr></li>
        <li><abbr title="Use a tag <dl>">Listas de descrição</abbr></li>
        <li><abbr title="Use a tag <strong>">Destaque</abbr></li>
        <li><abbr title="Use a tag <em>">Énfase</abbr></li>
        <li><abbr title="Use a tag <mark>">Marcar texto</abbr></li>
        <li><abbr title="Use a tag <code>">Codigo-fonte</abbr></li>
        <li><abbr title="Use a tag <q>">Citações simples</abbr></li>
        <li><abbr title="Use a tag <blockquote>">Citações completas</abbr></li>
        <li><abbr title="Use a tag <abbr>">Abreviações</abbr></li>
        <li><abbr title="Use a tag <bdo>">Inverter texto</abbr></li>
    </ul>
</body>
</html>
